# =============================================================================
# Smart Governance Platform for Administrative Operations with Citizen Service Assistance
# Application Configuration
# =============================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=Smart-Governance-Platform-Backend


# =============================================================================
# H2 Embedded Database Configuration (Development/Testing)
# Note: Using H2 instead of MySQL since MySQL is not available
# =============================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/finally_civicpulse_db
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=
spring.datasource.password=


# H2 Console (optional - for debugging)
spring.h2.console.enabled=true

# =============================================================================
# JPA / Hibernate Configuration
# =============================================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# =============================================================================
# HTTP Session Management Configuration
# =============================================================================

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=SMARTGOV_SESSION
server.servlet.session.cookie.same-site=lax


# =============================================================================
# File Upload Configuration
# =============================================================================

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB


# =============================================================================
# Logging Configuration
# =============================================================================

logging.level.com.smartgovernance=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG


# =============================================================================
# Demo Data
# Set to false if you do not want demonstration citizens/complaints
# =============================================================================

app.demo-data.enabled=true


# =============================================================================
# Gemini API (Google AI Studio free tier) - used by the Complaint Registration
# module for AI-assisted priority detection and photo-vs-description verification.
# Get a free key at https://aistudio.google.com/ - leave blank to disable (features
# fail open / are skipped safely if this is not set).
# =============================================================================

gemini.api.key=



gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
